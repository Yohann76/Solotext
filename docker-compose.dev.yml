name: solotext-dev

services:
  # Service PostgreSQL Database (même port, pas de conflit car dans Docker)
  postgres:
    image: postgres:15-alpine
    container_name: solotext-postgres-dev
    environment:
      - POSTGRES_DB=${DB_NAME:-solotext_db_dev}
      - POSTGRES_USER=${DB_USER:-solotext_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-solotext_password}
    ports:
      - "5433:5432"  # Port externe différent pour éviter conflit
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    networks:
      - solotext-network-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solotext_user -d solotext_db_dev"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: solotext-backend-dev
    ports:
      - "3001:3000"  # Port externe 3001 au lieu de 3000
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-solotext_db_dev}
      - DB_USER=${DB_USER:-solotext_user}
      - DB_PASSWORD=${DB_PASSWORD:-solotext_password}
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - ANALYSIS_QUEUE=analysis_queue
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - solotext-network-dev
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx sequelize-cli db:migrate --env development && npm start"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Adminer for the database administration
  adminer:
    image: adminer:4.8.1
    container_name: solotext-adminer-dev
    ports:
      - "8083:8080"  # Port externe 8083 au lieu de 8082
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - solotext-network-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service RabbitMQ for message queuing
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: solotext-rabbitmq-dev
    ports:
      - "5673:5672"   # AMQP port externe différent
      - "15673:15672" # Management UI port externe différent
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-admin123}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - rabbitmq_data_dev:/var/lib/rabbitmq
    networks:
      - solotext-network-dev
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Service Analysis Worker for processing text analyses
  analysis-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    container_name: solotext-analysis-worker-dev
    environment:
      - NODE_ENV=development
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-solotext_db_dev}
      - DB_USER=${DB_USER:-solotext_user}
      - DB_PASSWORD=${DB_PASSWORD:-solotext_password}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://admin:admin123@rabbitmq:5672}
      - ANALYSIS_QUEUE=analysis_queue
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-3.5-turbo
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - solotext-network-dev
    restart: unless-stopped
    volumes:
      - ./api:/app
      - /app/node_modules

  # Service App Frontend (Vue.js)
  app-frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: solotext-app-frontend-dev
    ports:
      - "8090:8080"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-/api} # Must be /api or complete URL?
      - VITE_WEBSITE_URL=${VITE_WEBSITE_URL:-http://localhost:8091}
    volumes:
      - ./app:/app
      - node_modules_app_dev:/app/node_modules
    networks:
      - solotext-network-dev
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 8080
    depends_on:
      - backend

  # Service Website Frontend (Vue.js)
  website-frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: solotext-website-frontend-dev
    ports:
      - "8091:8091"
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-http://localhost:3001/api}
      - VITE_APP_URL=${VITE_APP_URL:-http://localhost:8090}
    volumes:
      - ./website:/app
      - node_modules_website_dev:/app/node_modules
    networks:
      - solotext-network-dev
    restart: unless-stopped
    command: npm run dev:server -- --host 0.0.0.0 --port 8091

networks:
  solotext-network-dev:
    driver: bridge

volumes:
  postgres_data_dev:
  node_modules_backend_dev:
  node_modules_app_dev:
  node_modules_website_dev:
  rabbitmq_data_dev:

