name: solotext-production

services:
  # Service PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: solotext-postgres
    environment:
      - POSTGRES_DB=${DB_NAME:-solotext_db}
      - POSTGRES_USER=${DB_USER:-solotext_user}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-solotext_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - solotext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solotext_user -d solotext_db"] #use entrypoint for env variable
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: solotext-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000} #just port ?
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-solotext_db}
      - DB_USER=${DB_USER:-solotext_user}
      - DB_PASSWORD=${DB_PASSWORD:-solotext_password}
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - ANALYSIS_QUEUE=analysis_queue
    volumes:
      - ./api:/app
      - /app/node_modules
    networks:
      - solotext-network
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx sequelize-cli db:migrate --env ${NODE_ENV:-production} && npm start"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"] #use entrypoint for env variable
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Adminer for the database administration # http://localhost:8082/
  adminer:
    image: adminer:4.8.1
    container_name: solotext-adminer
    ports:
      - "8082:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - solotext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"] #use entrypoint for env variable
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service RabbitMQ for message queuing # http://localhost:15672/ (admin/admin123)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: solotext-rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_DEFAULT_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_DEFAULT_PASS:-admin123}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_DEFAULT_VHOST:-/}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - solotext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Service Analysis Worker for processing text analyses
  analysis-worker:
    build:
      context: ./api
      dockerfile: Dockerfile.worker
    container_name: solotext-analysis-worker
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-solotext_db}
      - DB_USER=${DB_USER:-solotext_user}
      - DB_PASSWORD=${DB_PASSWORD:-solotext_password}
      - RABBITMQ_URL=${RABBITMQ_URL:-amqp://admin:admin123@rabbitmq:5672}
      - ANALYSIS_QUEUE=analysis_queue
      - OPENAI_API_KEY=${OPENAI_API_KEY} # not use 
      - OPENAI_MODEL=gpt-3.5-turbo # TODO: .env # not use
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - solotext-network
    restart: unless-stopped
    volumes:
      - ./api:/app
      - /app/node_modules

  # Service App Frontend (Production)
  app-frontend:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: solotext-app-frontend
    ports:
      - "8080:8080"  # Port interne, accessible uniquement via Nginx
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_URL=${VITE_API_URL:-https://api.solotext.io/api}
      - VITE_WEBSITE_URL=${VITE_WEBSITE_URL:-https://solotext.io}
    volumes:
      - ./app:/app
      - node_modules_app:/app/node_modules
    networks:
      - solotext-network
    restart: unless-stopped
    command: npm run dev -- --host 0.0.0.0 --port 8080
    depends_on:
      - backend

  # Service Website Frontend (Production)
  website-frontend:
    build:
      context: ./website
      dockerfile: Dockerfile
    container_name: solotext-website-frontend
    ports:
      - "8081:8081"  # Port interne, accessible uniquement via Nginx
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - VITE_API_URL=${VITE_API_URL:-https://api.solotext.io/api}
      - VITE_APP_URL=${VITE_APP_URL:-https://app.solotext.io}
    volumes:
      - ./website:/app
      - node_modules_website:/app/node_modules
    networks:
      - solotext-network
    restart: unless-stopped
    command: npm run dev:server -- --host 0.0.0.0 --port 8081

networks:
  solotext-network:
    driver: bridge

volumes:
  postgres_data:
  node_modules_backend:
  node_modules_app:
  node_modules_website:
  rabbitmq_data:
