version: '3.8'

services:
  # Service PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: solotext-postgres
    environment:
      - POSTGRES_DB=solotext
      - POSTGRES_USER=solotext_user
      - POSTGRES_PASSWORD=solotext_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - solotext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solotext_user -d solotext"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solotext-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=solotext
      - DB_USER=solotext_user
      - DB_PASSWORD=solotext_password
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - ANALYSIS_QUEUE=analysis_queue
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - solotext-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solotext-frontend
    ports:
      - "8080:8080"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend
    networks:
      - solotext-network
    restart: unless-stopped

  # Service Adminer for the database administration # http://localhost:8081/
  adminer:
    image: adminer:4.8.1
    container_name: solotext-adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - solotext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service RabbitMQ for message queuing # http://localhost:15672/ (admin/admin123)
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: solotext-rabbitmq
    ports:
      - "5672:5672"   # AMQP port
      - "15672:15672" # Management UI
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=admin123
      - RABBITMQ_DEFAULT_VHOST=/
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - solotext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5

  # Service Analysis Worker for processing text analyses
  analysis-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile.worker
    container_name: solotext-analysis-worker
    environment:
      - NODE_ENV=production
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=solotext
      - DB_USER=solotext_user
      - DB_PASSWORD=solotext_password
      - RABBITMQ_URL=amqp://admin:admin123@rabbitmq:5672
      - ANALYSIS_QUEUE=analysis_queue
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-3.5-turbo # TODO: .env
      - PERPLEXITY_API_KEY=${PERPLEXITY_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - solotext-network
    restart: unless-stopped
    volumes:
      - ./backend:/app
      - /app/node_modules

networks:
  solotext-network:
    driver: bridge

volumes:
  postgres_data:
  node_modules_backend:
  node_modules_frontend:
  rabbitmq_data:
