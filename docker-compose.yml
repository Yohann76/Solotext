version: '3.8'

services:
  # Service PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: solotext-postgres
    environment:
      - POSTGRES_DB=solotext
      - POSTGRES_USER=solotext_user
      - POSTGRES_PASSWORD=solotext_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - solotext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solotext_user -d solotext"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: solotext-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=solotext
      - DB_USER=solotext_user
      - DB_PASSWORD=solotext_password
    volumes:
      - ./backend:/app
      - /app/node_modules
    networks:
      - solotext-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: solotext-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - solotext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Service Adminer for the database administration # http://localhost:8081/
  adminer:
    image: adminer:4.8.1
    container_name: solotext-adminer
    ports:
      - "8081:8080"
    environment:
      - ADMINER_DEFAULT_SERVER=postgres
    depends_on:
      - postgres
    networks:
      - solotext-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  solotext-network:
    driver: bridge

volumes:
  postgres_data:
  node_modules_backend:
  node_modules_frontend:
