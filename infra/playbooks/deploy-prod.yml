---
# Playbook pour le déploiement sur l'environnement de production

- name: Déploiement SoloText sur Production
  hosts: production
  become: yes
  gather_facts: yes

  vars:
    deployment_env: production

  vars_files:
    - "{{ inventory_dir }}/group_vars/production.yml"
    - "{{ inventory_dir }}/group_vars/production/vault.yml"

  pre_tasks:
    - name: Confirmer le déploiement en production
      pause:
        prompt: |
          ⚠️  ATTENTION : Vous êtes sur le point de déployer en PRODUCTION ⚠️
          
          Vérifiez que :
          - Tous les tests passent
          - Les sauvegardes sont à jour
          - Les variables d'environnement sont correctes
          
          Appuyez sur Entrée pour continuer ou Ctrl+C pour annuler
        echo: yes

  roles:
    - role: common
      tags: [common, system]

    - role: database
      tags: [database, postgres]
      when: deploy_database | default(true)

    - role: backend
      tags: [backend, api]
      when: deploy_backend | default(true)

    - role: frontend
      tags: [frontend, web]
      when: deploy_frontend | default(true)

    - role: nginx_proxy
      tags: [nginx, proxy, ssl]
      when: deploy_nginx | default(true)

  post_tasks:
    - name: Créer une sauvegarde de la base de données
      command: >
        docker exec solotext-postgres pg_dump -U {{ db_user }} {{ db_name }}
        > {{ postgres_backup_dir }}/backup-{{ ansible_date_time.epoch }}.sql
      become: yes
      become_user: "{{ app_user }}"
      when: backup_enabled | default(false) and deploy_database | default(true)
      register: backup_result
      changed_when: backup_result.rc == 0

    - name: Nettoyer les anciennes sauvegardes
      find:
        paths: "{{ postgres_backup_dir }}"
        patterns: "backup-*.sql"
        age: "{{ backup_retention_days }}d"
      register: old_backups
      when: backup_enabled | default(false)

    - name: Supprimer les anciennes sauvegardes
      file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ old_backups.files }}"
      when: old_backups.files | length > 0

    - name: Afficher le résumé du déploiement
      debug:
        msg:
          - "✅ Déploiement en production terminé sur {{ inventory_hostname }}"
          - "Backend: http://{{ inventory_hostname }}:{{ backend_port }}"
          - "Frontend: https://{{ nginx_domain }}"
          - "PostgreSQL: localhost:{{ postgres_port }}"
          - "Sauvegarde créée: {{ backup_result.stdout_lines[-1] if backup_result is defined else 'N/A' }}"

    - name: Vérifier la santé des services
      uri:
        url: "http://localhost:{{ backend_port }}/api/health"
        method: GET
        status_code: 200
      register: health_check
      failed_when: health_check.status != 200
      when: deploy_backend | default(true)

