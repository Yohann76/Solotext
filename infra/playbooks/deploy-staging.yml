---
# Playbook pour le déploiement sur l'environnement de staging

- name: Déploiement SoloText sur Staging
  hosts: staging
  become: yes
  gather_facts: yes

  vars:
    deployment_env: staging

  pre_tasks:
    - name: Mettre à jour les informations système
      setup:
        gather_subset: minimal

  roles:
    - role: common
      tags: [common, system]

    - role: database
      tags: [database, postgres]
      when: deploy_database | default(true)

    - role: backend
      tags: [backend, api]
      when: deploy_backend | default(true)

    - role: frontend
      tags: [frontend, web]
      when: deploy_frontend | default(true)

    - role: nginx_proxy
      tags: [nginx, proxy, ssl]
      when: deploy_nginx | default(true)

  post_tasks:
    - name: Afficher le résumé du déploiement
      debug:
        msg:
          - "Déploiement terminé sur {{ inventory_hostname }}"
          - "Backend: http://{{ inventory_hostname }}:{{ backend_port }}"
          - "Frontend: http://{{ nginx_domain }}"
          - "PostgreSQL: localhost:{{ postgres_port }}"

    - name: Vérifier la santé des services
      uri:
        url: "http://localhost:{{ backend_port }}/api/health"
        method: GET
        status_code: 200
      register: health_check
      failed_when: health_check.status != 200
      when: deploy_backend | default(true)

