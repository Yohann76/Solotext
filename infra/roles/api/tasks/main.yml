---
# Rôle api : Déploiement de l'API via Docker Compose

- name: Créer le répertoire de l'application
  file:
    path: "{{ app_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: yes

- name: Configurer Git pour accepter le répertoire comme safe directory
  command: git config --global --add safe.directory "{{ app_dir }}"
  become: yes
  ignore_errors: yes

- name: Configurer Git pour accepter le répertoire comme safe directory (app_user)
  command: git config --global --add safe.directory "{{ app_dir }}"
  become: yes
  become_user: "{{ app_user }}"
  ignore_errors: yes

- name: Nettoyer les fichiers non suivis avant le checkout (si le dépôt existe)
  command: git clean -fd
  args:
    chdir: "{{ app_dir }}"
  become: yes
  become_user: "{{ app_user }}"
  ignore_errors: yes
  when: git_repo is defined

- name: Réinitialiser les modifications locales avant le checkout
  command: git reset --hard HEAD
  args:
    chdir: "{{ app_dir }}"
  become: yes
  become_user: "{{ app_user }}"
  ignore_errors: yes
  when: git_repo is defined

- name: Cloner ou mettre à jour le dépôt Git
  git:
    repo: "{{ git_repo }}"
    dest: "{{ app_dir }}"
    version: "{{ git_branch | default(git_version) }}"
    force: yes
    update: yes
  become: yes
  when: git_repo is defined

- name: Assurer les permissions du dépôt
  file:
    path: "{{ app_dir }}"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    recurse: yes
  become: yes
  when: git_repo is defined

- name: Créer le fichier .env à la racine pour docker-compose
  template:
    src: docker-compose.env.j2
    dest: "{{ app_dir }}/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  become: yes

- name: S'assurer que le répertoire api existe
  file:
    path: "{{ app_dir }}/api"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: yes

- name: Créer le fichier .env pour l'API
  template:
    src: api.env.j2
    dest: "{{ app_dir }}/api/.env"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  become: yes

- name: Arrêter les conteneurs existants
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files:
      - docker-compose.yml
    state: absent
  become: yes
  become_user: "{{ app_user }}"
  ignore_errors: yes

- name: Supprimer le volume PostgreSQL pour réinitialiser la base de données
  command: docker compose down -v
  args:
    chdir: "{{ app_dir }}"
  become: yes
  become_user: "{{ app_user }}"
  register: volume_remove_result
  ignore_errors: yes
  changed_when: volume_remove_result.rc == 0
  failed_when: false

- name: Construire et démarrer les services avec Docker Compose
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files:
      - docker-compose.yml
    state: present
    pull: missing
    build: always
  become: yes
  become_user: "{{ app_user }}"

- name: Attendre que l'API soit prête
  uri:
    url: "http://localhost:{{ backend_port }}/api/health"
    method: GET
    status_code: [200, 404]
  register: health_check
  until: health_check.status == 200
  retries: 10
  delay: 3
  ignore_errors: yes

- name: Afficher les logs du backend si le health check a échoué
  command: docker compose logs backend --tail=50
  args:
    chdir: "{{ app_dir }}"
  become: yes
  become_user: "{{ app_user }}"
  register: backend_logs
  when: health_check.status != 200
  changed_when: false
  failed_when: false

- name: Afficher les logs du backend
  debug:
    var: backend_logs.stdout_lines
  when: health_check.status != 200 and backend_logs.stdout_lines is defined

- name: Avertissement si l'API n'est pas prête
  debug:
    msg:
      - "⚠️  L'API n'est pas encore prête après le déploiement"
      - "Vérifiez les logs avec : cd {{ app_dir }} && docker compose logs backend"
      - "Vérifiez l'état avec : cd {{ app_dir }} && docker compose ps"
      - "Testez avec : curl http://localhost:{{ backend_port }}/api/health"
  when: health_check.status != 200
