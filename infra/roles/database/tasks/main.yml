---
# Rôle database : Configuration PostgreSQL avec Docker

- name: Vérifier que Docker est installé
  command: docker --version
  register: docker_version
  changed_when: false
  failed_when: false

- name: Créer le répertoire de données PostgreSQL
  file:
    path: "{{ postgres_data_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: yes

- name: Créer le répertoire de sauvegardes PostgreSQL
  file:
    path: "{{ postgres_backup_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0755'
  become: yes
  when: backup_enabled | default(false)

- name: Créer le fichier .env pour PostgreSQL
  template:
    src: postgres.env.j2
    dest: "{{ app_dir }}/.env.postgres"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0600'
  become: yes

- name: Créer le docker-compose pour PostgreSQL
  template:
    src: postgres-compose.yml.j2
    dest: "{{ app_dir }}/docker-compose.postgres.yml"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: '0644'
  become: yes

- name: Démarrer le conteneur PostgreSQL
  community.docker.docker_compose_v2:
    project_src: "{{ app_dir }}"
    files:
      - docker-compose.postgres.yml
    state: present
  become: yes
  become_user: "{{ app_user }}"

- name: Attendre que PostgreSQL soit prêt
  wait_for:
    port: "{{ postgres_port }}"
    host: localhost
    delay: 10
    timeout: 60
  become: yes

- name: Vérifier la connexion à PostgreSQL
  command: docker exec solotext-postgres pg_isready -U {{ db_user }} -d {{ db_name }}
  register: postgres_check
  changed_when: false
  failed_when: postgres_check.rc != 0

